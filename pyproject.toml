[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "debugpy>=1.8.14,<2",
    "isort>=6.0.1,<7",
    "pre-commit>=4.2.0,<5",
    "uvicorn",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-xdist",
    "requests",
    "httpx",
    "ruff>=0.12.3,<0.13",
    "tox>=4.27.0,<5"
]

[project]
name = "ab-fastapi-limiter"
version = "0.2.0"
description = "A request rate limiter for fastapi"
authors = [
    { name = "long2ice", email = "long2ice@gmail.com" },
    { name = "mattcoulter7", email = "mattcoul7@gmail.com" }
]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "MIT"
keywords = ["fastapi", "limiter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi",
    "pyrate-limiter>=3.9.0"
]

[project.urls]
Homepage = "https://github.com/auth-broker/fastapi-limiter"
Repository = "https://github.com/auth-broker/fastapi-limiter.git"
Documentation = "https://github.com/auth-broker/fastapi-limiter"

[tool.hatch.build.targets.sdist]
include = ["src/ab_core"]

[tool.hatch.build.targets.wheel]
include = ["src/ab_core"]

[tool.hatch.build.targets.wheel.sources]
"src/ab_core" = "ab_core"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
markers = [
  "integration: Assigns the test to the integration test suite.",
  "regression: Assigns the test to the regression test suite"
]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
exclude = [".git", ".venv", "__pycache__", "proto"]
fixable = ["ALL"]
ignore = [
  "D104" # missing docstring in public package
]
select = [
  "ARG001", # unused arguments
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "D", # pydocstyle (docstring checks)
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "W" # pycodestyle warnings
]
